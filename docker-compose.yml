# PrivateHire Cars — full local stack in Docker (development mode).
#
#   docker compose up -d        start everything (first run downloads images + installs packages: a few minutes)
#   docker compose logs -f be   follow the API log (MOCK emails are printed here)
#   docker compose down         stop (data is kept in the db-data volume)
#   docker compose down -v      stop AND wipe the database + installed packages
#
#   Customer app   http://localhost:5173
#   Staff Portal   http://localhost:5174
#   API            http://localhost:4000/api/health
#   MySQL          localhost:3307  (user root / password privatehire) — 3307 so it never clashes with a MySQL on 3306
#
# Source code is mounted from this folder, so edits are picked up without rebuilding.
# node_modules live in named volumes (Linux packages), separate from any node_modules on Windows.
name: privatehire

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-privatehire}
      MYSQL_DATABASE: privatehire
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  be:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app/be
    # db:init creates + seeds the database only when it is empty; existing data is kept.
    command: sh -c "npm ci --no-audit --no-fund && npm run db:init && npm run dev"
    env_file:
      # Email settings (EMAIL_PROVIDER, EmailJS keys, MOCK_EMAIL_FAIL...) are read from be/.env if it exists.
      - path: ./be/.env
        required: false
    environment:
      # These override be/.env so the API always talks to the MySQL container.
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-privatehire}
      DB_NAME: privatehire
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-docker-dev-only-secret-please-change-0123456789}
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - be-node-modules:/app/be/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  web:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app/web
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://be:4000
      VITE_USE_POLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules
    depends_on:
      - be

  app:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      API_PROXY_TARGET: http://be:4000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      - be

volumes:
  db-data:
  be-node-modules:
  web-node-modules:
  app-node-modules:
